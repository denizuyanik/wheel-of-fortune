<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wheel of Fortune — Widget Settings</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Comic+Neue:wght@700&family=Inter:wght@400;600;700&family=Montserrat:wght@600;800&family=Orbitron:wght@700&family=Outfit:wght@500;700;800&family=Playfair+Display:wght@700&family=Poppins:wght@500;600;700&family=Roboto:wght@500;700&display=swap">
  <style>
    :root {
      --primary: #f59e0b;
      --primary-hover: #d97706;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      font-size: 13px;
      line-height: 1.4;
      overflow-x: hidden;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 16px;
    }
    .panel-title {
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    select, input[type="number"] {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    select:focus, input[type="number"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2);
    }
    .theme-preview {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 6px;
    }
    .theme-card {
      padding: 8px 4px;
      border-radius: 6px;
      border: 2px solid transparent;
      cursor: pointer;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      transition: all 0.2s;
    }
    .theme-card.active {
      border-color: var(--primary) !important;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
      transform: scale(1.03);
    }
    .theme-gold { background: linear-gradient(135deg, #1e1b4b, #0f172a); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }
    .theme-dark { background: #09090b; color: #a855f7; border: 1px solid #27272a; }
    .theme-neon { background: #022c22; color: #10b981; border: 1px solid #064e3b; }
    .theme-light { background: #f8fafc; color: #0f172a; border: 1px solid #e2e8f0; }

    .btn-save {
      width: 100%;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 18px;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
      transition: all 0.2s;
    }
    .btn-save:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5);
    }
    .btn-save:active {
      transform: translateY(0);
    }

    .btn-secondary {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.2s;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
    }

    .alert-toast {
      display: none;
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      animation: fadeIn 0.3s forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="panel-header">
    <div class="panel-title">
      🎡 Settings <span class="badge">WIX</span>
    </div>
  </div>

  <div class="form-group">
    <label for="setting-lang">🌍 Default Language (16 Languages)</label>
    <select id="setting-lang" onchange="applyAndBroadcast()">
      <option value="en">English 🇺🇸 (Default)</option>
      <option value="tr">Türkçe 🇹🇷</option>
      <option value="de">Deutsch 🇩🇪</option>
      <option value="fr">Français 🇫🇷</option>
      <option value="es">Español 🇪🇸</option>
      <option value="he">עברית 🇮🇱</option>
      <option value="zh">中文 🇨🇳</option>
      <option value="ja">日本語 🇯🇵</option>
      <option value="ko">한국어 🇰🇷</option>
      <option value="hi">हिन्दी 🇮🇳</option>
      <option value="pt">Português 🇵🇹</option>
      <option value="ru">Русский 🇷🇺</option>
      <option value="uk">Українська 🇺🇦</option>
      <option value="el">Ελληνικά 🇬🇷</option>
      <option value="it">Italiano 🇮🇹</option>
      <option value="ar">العربية 🇸🇦</option>
    </select>
  </div>

  <div class="form-group">
    <label for="setting-theme">🎨 Visual Theme</label>
    <select id="setting-theme" onchange="onThemeSelectChange(this.value)">
      <option value="gold">👑 Royal Gold Luxury</option>
      <option value="dark">🌌 Dark Nebula Glow</option>
      <option value="neon">⚡ Emerald Cyber Neon</option>
      <option value="light">☀️ Clean Light Modern</option>
    </select>
    <div class="theme-preview">
      <div class="theme-card theme-gold active" onclick="selectTheme('gold')">Gold</div>
      <div class="theme-card theme-dark" onclick="selectTheme('dark')">Dark</div>
      <div class="theme-card theme-neon" onclick="selectTheme('neon')">Neon</div>
      <div class="theme-card theme-light" onclick="selectTheme('light')">Light</div>
    </div>
  </div>

  <div class="form-group">
    <label for="setting-font">🔤 Google Font Family</label>
    <select id="setting-font" onchange="applyAndBroadcast()">
      <option value="Outfit">Outfit (Clean & Modern)</option>
      <option value="Poppins">Poppins (Geometric Sans)</option>
      <option value="Inter">Inter (Ultra Legible)</option>
      <option value="Montserrat">Montserrat (Bold Header)</option>
      <option value="Roboto">Roboto (Classic Neutral)</option>
      <option value="Playfair Display">Playfair Display (Luxury Serif)</option>
      <option value="Cinzel">Cinzel (Regal Roman)</option>
      <option value="Orbitron">Orbitron (Sci-Fi / Cyber)</option>
      <option value="Comic Neue">Comic Neue (Playful / Fun)</option>
    </select>
  </div>

  <div class="form-group">
    <label for="setting-limit">🛡️ Daily Spin Limit Per Visitor</label>
    <input type="number" id="setting-limit" min="1" max="100" value="1" onchange="applyAndBroadcast()" />
  </div>

  <button class="btn-save" id="btn-save-settings" onclick="saveSettings()">
    💾 Save & Apply Settings
  </button>

  <div class="alert-toast" id="save-toast">
    ✅ Settings Saved & Applied to Live Wheel!
  </div>

  <button class="btn-secondary" onclick="resetSpinLimit()">
    🔄 Reset My Daily Limit (Testing)
  </button>

  <script>
    let bChannel;
    try {
      bChannel = new BroadcastChannel("wof_settings_channel");
    } catch(e) {}

    function getSettingsObject() {
      return {
        lang: document.getElementById("setting-lang").value,
        colorTheme: document.getElementById("setting-theme").value,
        fontFamily: document.getElementById("setting-font").value,
        dailyLimit: parseInt(document.getElementById("setting-limit").value, 10) || 1
      };
    }

        function applyAndBroadcast() {
      const settings = getSettingsObject();
      const ts = Date.now().toString();

      try {
        localStorage.setItem("wof_settings", JSON.stringify(settings));
        localStorage.setItem("wof_settings_timestamp", ts);
      } catch(e) {}

      const msg = { type: "wof-update-settings", settings: settings, timestamp: ts };

      // 1. BroadcastChannel
      if (bChannel) {
        try { bChannel.postMessage(msg); } catch(e) {}
      }

      // 2. Comprehensive Deep Frame Broadcast across all Wix iframes
      try { window.postMessage(msg, "*"); } catch(e) {}
      try { window.parent.postMessage(msg, "*"); } catch(e) {}
      try { window.top.postMessage(msg, "*"); } catch(e) {}
      try { if (window.opener) window.opener.postMessage(msg, "*"); } catch(e) {}

      function deepPost(w) {
        if (!w) return;
        try {
          w.postMessage(msg, "*");
        } catch(e) {}
        try {
          for (let i = 0; i < w.frames.length; i++) {
            try {
              deepPost(w.frames[i]);
            } catch(e) {}
          }
        } catch(e) {}
      }

      try { deepPost(window.top); } catch(e) {}
      try { deepPost(window.parent); } catch(e) {}
    }

    function selectTheme(theme) {
      document.getElementById("setting-theme").value = theme;
      updateThemeCards(theme);
      applyAndBroadcast();
    }

    function onThemeSelectChange(theme) {
      updateThemeCards(theme);
      applyAndBroadcast();
    }

    function updateThemeCards(theme) {
      document.querySelectorAll(".theme-card").forEach(c => c.classList.remove("active"));
      const activeCard = document.querySelector(".theme-" + theme);
      if (activeCard) activeCard.classList.add("active");
    }

    function saveSettings() {
      applyAndBroadcast();
      const toast = document.getElementById("save-toast");
      toast.style.display = "block";
      setTimeout(() => {
        toast.style.display = "none";
      }, 3000);
    }

    function resetSpinLimit() {
      localStorage.removeItem("wof_spin_history");
      localStorage.removeItem("wof_usage");
      localStorage.setItem("wof_reset_timestamp", Date.now().toString());
      if (bChannel) {
        try { bChannel.postMessage({ type: "wof-reset-limit" }); } catch(e) {}
      }
      try { window.parent.postMessage({ type: "wof-reset-limit" }, "*"); } catch(e) {}
      alert("✅ Your local spin limit has been reset for testing!");
    }

    // Load persisted settings
    function loadCurrentSettings() {
      try {
        const saved = localStorage.getItem("wof_settings");
        if (saved) {
          const config = JSON.parse(saved);
          if (config.lang) document.getElementById("setting-lang").value = config.lang;
          if (config.colorTheme) {
            document.getElementById("setting-theme").value = config.colorTheme;
            updateThemeCards(config.colorTheme);
          }
          if (config.fontFamily) document.getElementById("setting-font").value = config.fontFamily;
          if (config.dailyLimit) document.getElementById("setting-limit").value = config.dailyLimit;
        }
      } catch (e) {}
    }

    loadCurrentSettings();
  </script>
</body>
</html>
